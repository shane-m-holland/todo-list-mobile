spring:
  application:
    name: todo-backend
  profiles:
    # `memory` needs nothing but a JVM. Run with SPRING_PROFILES_ACTIVE=postgres for persistence.
    default: memory
  jackson:
    default-property-inclusion: non_null # absent notes are omitted, never null
    deserialization:
      fail-on-unknown-properties: true # the contract sets additionalProperties: false

server:
  port: ${SERVER_PORT:8081} # 8080 is the WireMock mock

management:
  endpoints:
    web:
      exposure:
        include: health

todo:
  seed:
    # Sample todos at startup, only into an empty store (same data as `make mock-reset`).
    enabled: ${TODO_SEED_ENABLED:true}
